<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>爱宠知识</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #e8f4e1; 
            padding: 50px 0;
        }
        .outer-box {
            width: 370px;
            height: 550px;
            margin: 0 auto;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            padding-top: 20px;
            background-color: #8bc34a;
            background-image: radial-gradient(#aed581 15%, transparent 16%), radial-gradient(#aed581 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
        .title {
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
            margin: 0 auto 20px auto;
            width: 310px; 
            border-left: 6px solid #bbeb2c;
            padding-left: 10px;
            line-height: 1.2;
        }
        .inner-box {
            width: 350px;
            height: 460px;
            background-color: #fff;
            margin: 0 auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 10px 15px 10px 20px;
            overflow: hidden;
        }
        ul {
            list-style: none; 
        }

        li {
            height: 48px;
            line-height: 48px;
            border-bottom: 1px dashed #ccc; 
            position: relative;
            padding-left: 35px; 
        }

        li:last-child {
            border-bottom: none; 
        }
        li::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;  
            height: 22px; 
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="%239acd32"><path d="M256,448c-61.9,0-112-50.1-112-112c0-41.8,23.3-78.1,57.6-97.4c12.9-7.2,27.3-11.4,42.3-12.4c16.9-1,33.5,2.6,48.7,10.4c13.6,7.1,25.6,16.9,35.1,28.7c19.8,24.5,30.4,55.4,30.4,87.4C368,397.9,317.9,448,256,448z"/><ellipse cx="128" cy="192" rx="48" ry="64" transform="rotate(-30 128 192)"/><ellipse cx="224" cy="112" rx="40" ry="56"/><ellipse cx="288" cy="112" rx="40" ry="56"/><ellipse cx="384" cy="192" rx="48" ry="64" transform="rotate(30 384 192)"/></svg>');
            background-size: cover;
        }
        a {
            color: #333;
            text-decoration: none;
            font-size: 16px; 
            text-shadow: 1px 1px 2px #739311; 
            transition: all 0.2s;
            display: block; 
            text-align: left; 
            width: 100%; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        a:hover {
            font-weight: bold;
            color: #bbeb2c; 
        }
    </style>
</head>
<body>

    <div class="outer-box">
        <div class="title">爱宠知识</div>
        <div class="inner-box">
            <ul>
                <li><a href="#">养狗比养猫对健康更有利</a></li>
                <li><a href="#">日本正宗柴犬亮相，你怎么看柴犬？</a></li>
                <li><a href="#">狗狗歌曲《新年旺旺》</a></li>
                <li><a href="#">带宠兜风，开车带宠需要注意什么？</a></li>
                <li><a href="#">【爆笑】这狗狗太不给力了！</a></li>
                <li><a href="#">狗狗与男童相同着装拍有爱造型照</a></li>
                <li><a href="#">狗狗各个阶段健康大事件</a></li>
                <li><a href="#">调皮宠物狗陷在沙发里的搞笑瞬间</a></li>
                <li><a href="#">为什么每次大小便后，会用脚踢土？</a></li>
            </ul>
        </div>
    </div>

</body>
</html>
