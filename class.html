<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图书馆读者调查问卷</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px 40px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .intro {
            text-indent: 2em;
            color: #555;
            margin-bottom: 20px;
            background-color: #f1f8ff;
            padding: 15px;
            border-left: 4px solid #3498db;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        td {
            padding: 10px 5px;
            vertical-align: top;
        }
        .question-label {
            width: 180px; 
            font-weight: bold;
            color: #2c3e50;
        }
        .question-input {
        }
        label {
            margin-right: 15px;
            cursor: pointer;
        }
        input[type="text"] {
            width: 250px;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #3498db;
        }
        textarea {
            width: 400px;
            height: 80px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical; 
            outline: none;
        }

        textarea:focus {
            border-color: #3498db;
        }
        .submit-area {
            text-align: center;
            margin-top: 30px;
        }

        .submit-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 40px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>图书馆读者调查问卷</h1>
        
        <div class="intro">
            为了能够及时了解您对图书馆的需求，提升我校图书馆文献资源建设的质量和水平，更好的为我校教学科研服务，我馆特设计了问卷调查题目如下，请协助填写，谢谢您的合作！
        </div>

        <form action="#" method="post">
            <table>
                <tr>
                    <td class="question-label">1. 您的年级：</td>
                    <td class="question-input">
                        <label><input type="radio" name="grade" value="大一"> 大一</label>
                        <label><input type="radio" name="grade" value="大二"> 大二</label>
                        <label><input type="radio" name="grade" value="大三"> 大三</label>
                        <label><input type="radio" name="grade" value="大四"> 大四</label>
                        <label><input type="radio" name="grade" value="研究生"> 研究生及以上</label>
                    </td>
                </tr>
                <tr>
                    <td class="question-label">2. 您的专业：</td>
                    <td class="question-input">
                        <input type="text" name="major" placeholder="请输入您的专业">
                    </td>
                </tr>
                <tr>
                    <td class="question-label">3. 对于图书馆的阅览环境：</td>
                    <td class="question-input">
                        <div style="margin-bottom: 8px;">
                            <label><input type="radio" name="environment" value="满意"> 满意</label>
                            <label><input type="radio" name="environment" value="基本满意"> 基本满意</label>
                            <label><input type="radio" name="environment" value="不满意"> 不满意</label>
                        </div>
                        您的建议：<input type="text" name="env_suggestion" placeholder="请填写建议">
                    </td>
                </tr>
                <tr>
                    <td class="question-label">4. 您到图书馆的原因是<br>（可多选）：</td>
                    <td class="question-input">
                        <label><input type="checkbox" name="reason" value="借阅专业图书"> 借阅专业图书</label><br>
                        <label><input type="checkbox" name="reason" value="随便坐坐，翻翻书刊"> 随便坐坐，翻翻书刊</label><br>
                        <label><input type="checkbox" name="reason" value="借阅光盘"> 借阅光盘</label><br>
                        <label><input type="checkbox" name="reason" value="参加图书馆组织的活动"> 参加图书馆组织的活动</label><br>
                        <label><input type="checkbox" name="reason" value="自习，复习功课"> 自习，复习功课</label><br>
                        <label><input type="checkbox" name="reason" value="上网"> 上网</label><br>
                        <label><input type="checkbox" name="reason" value="检索电子文献"> 检索电子文献</label>
                    </td>
                </tr>
                <tr>
                    <td class="question-label">5. 您到图书馆的频率：</td>
                    <td class="question-input">
                        <label><input type="radio" name="frequency" value="几乎每天"> 几乎每天</label>
                        <label><input type="radio" name="frequency" value="每周1-2次"> 每周1-2次</label>
                        <label><input type="radio" name="frequency" value="每月1-2次"> 每月1-2次</label>
                        <label><input type="radio" name="frequency" value="几乎不去"> 几乎不去</label>
                    </td>
                </tr>
                <tr>
                    <td class="question-label">6. 您对学校的建议：</td>
                    <td class="question-input">
                        <div style="margin-bottom: 8px;">请您提出宝贵建议：</div>
                        <textarea name="suggestion" placeholder="在此输入您的建议..."></textarea>
                    </td>
                </tr>
            </table>

            <div class="submit-area">
                <button type="submit" class="submit-btn">提交问卷</button>
            </div>
        </form>
    </div>

</body>
</html>
